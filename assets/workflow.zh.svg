<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="品牌源力策略工作流程" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect width="1200" height="300" rx="20" fill="#faf8f3"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#111111">品牌源力策略 · 工作流程</text>
  <text x="40" y="80" font-size="14" fill="#686860">P = C × U × M × S：一项接近零，整体立不住</text>
  <g font-size="16" fill="#111111" text-anchor="middle">
    <rect x="40" y="120" width="160" height="100" rx="12" fill="#ffffff" stroke="#e4e0d5" stroke-width="2"/>
    <text x="120" y="160" font-weight="700">1 收集证据</text>
    <text x="120" y="188" font-size="13" fill="#686860">事实和例子</text>
    <text x="120" y="206" font-size="13" fill="#686860">不要形容词</text>

    <rect x="236" y="120" width="160" height="100" rx="12" fill="#ffffff" stroke="#e4e0d5" stroke-width="2"/>
    <text x="316" y="160" font-weight="700">2 按细则打分</text>
    <text x="316" y="188" font-size="13" fill="#686860">16 项 · 0–5 分</text>
    <text x="316" y="206" font-size="13" fill="#686860">每项写出证据</text>

    <rect x="432" y="120" width="160" height="100" rx="12" fill="#ffd900" stroke="#111111" stroke-width="2"/>
    <text x="512" y="160" font-weight="700">3 找根</text>
    <text x="512" y="188" font-size="13">一句话源力</text>
    <text x="512" y="206" font-size="13">过真、要、异、久四关</text>

    <rect x="628" y="120" width="160" height="100" rx="12" fill="#ffffff" stroke="#e4e0d5" stroke-width="2"/>
    <text x="708" y="160" font-weight="700">4 脚本计算</text>
    <text x="708" y="188" font-size="13" fill="#686860">几何平均 · 档位</text>
    <text x="708" y="206" font-size="13" fill="#686860">检查证据规则</text>

    <rect x="824" y="120" width="160" height="100" rx="12" fill="#ffffff" stroke="#e4e0d5" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="904" y="160" font-weight="700">5 Jev 复核</text>
    <text x="904" y="188" font-size="13" fill="#686860">可选的第二意见</text>
    <text x="904" y="206" font-size="13" fill="#686860">只提分歧，不改分</text>

    <rect x="1020" y="120" width="140" height="100" rx="12" fill="#111111"/>
    <text x="1090" y="160" font-weight="700" fill="#ffffff">6 交付一页</text>
    <text x="1090" y="188" font-size="13" fill="#e4e0d5">策略五句</text>
    <text x="1090" y="206" font-size="13" fill="#e4e0d5">先做三件事</text>
  </g>
  <g stroke="#111111" stroke-width="2" fill="none">
    <path d="M204 170h28m-7-6 7 6-7 6"/>
    <path d="M400 170h28m-7-6 7 6-7 6"/>
    <path d="M596 170h28m-7-6 7 6-7 6"/>
    <path d="M792 170h28m-7-6 7 6-7 6"/>
    <path d="M988 170h28m-7-6 7 6-7 6"/>
  </g>
  <text x="40" y="264" font-size="13" fill="#686860">C 不高于 3 分时不写源力句，只交付回去找根的三件事。</text>
</svg>
